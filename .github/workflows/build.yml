name: Compile all

on:
  workflow_dispatch:

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install stubgen-pyx "numpy>=1.7"

      - name: Compile all
        run: python apricot/speed/setup.py

      - uses: EndBug/add-and-commit@v9
        with:
          pull: '--rebase --autostash'
          add: '-A'
          default_author: github_actions
          message: '🛠️ Build for ${{ matrix.name }} :)'
